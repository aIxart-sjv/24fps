services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: 24fps-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - APP_ENV=development
      - APP_VERSION=0.1.0
      - DATABASE_URL=sqlite:///./data/case_metadata.db
      - EVIDENCE_ROOT=./data/evidence
      - ARTIFACT_ROOT=./data/artifacts
      - REPORT_ROOT=./data/reports
      - TEMP_ROOT=./data/temp
      - LOG_ROOT=./data/logs
      - AI_MODEL_ROOT=./data/models
      - FFMPEG_PATH=ffmpeg
      - MAX_WORKERS=4
      - LOG_LEVEL=INFO
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=admin
      - ADMIN_DISPLAY_NAME=Administrator
    volumes:
      # Persist SQLite DB, evidence images, artifacts, logs, and AI models to host
      - ./backend/data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 25s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=/api/v1
    container_name: 24fps-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
