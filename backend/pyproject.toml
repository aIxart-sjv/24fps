[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "24fps-forensic-backend"
version = "0.1.0"
description = "SIH26150 Multi-Vendor DVR/NVR Forensic Analysis Platform — Backend"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "24FPS Team" }]

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "libewf-python>=20240506,<21000000",
    "ultralytics>=8.3,<9.0",
    "opencv-python>=4.10,<6.0",
    "lap>=0.5.12,<1.0",
    "reportlab>=4.0,<5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-cov>=5.0,<6.0",
    "httpx>=0.27,<1.0",
    "black>=24.4,<25.0",
    "ruff>=0.5,<1.0",
    "mypy>=1.10,<2.0",
    "pypdf>=4.0,<6.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.mypy]
# 3.12 (not the "requires-python >= 3.11" floor): numpy's own bundled
# stubs (a transitive Phase 13 AI dependency, via ultralytics/opencv) use
# `type X = ...` PEP 695 syntax that requires mypy to target 3.12 to
# parse at all. The actual development venv already runs Python 3.12.13.
python_version = "3.12"
strict = true
ignore_missing_imports = true